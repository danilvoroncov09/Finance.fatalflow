<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Финансовый трекер</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2, h3 { text-align: center; color: #333; margin-top: 0; }
        
        /* Стили для форм */
        input, button, select { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
        .btn-danger { background-color: #dc3545; }
        .btn-danger:hover { background-color: #c82333; }
        
        /* Скрытые элементы */
        .hidden { display: none; }
        
        /* Стили дашборда и блоков */
        .dashboard, .goal-section { display: flex; justify-content: space-between; background: #e9ecef; padding: 15px; border-radius: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .dashboard div { text-align: center; width: 30%; }
        .goal-section { display: block; }
        
        .transaction-list { list-style: none; padding: 0; }
        .transaction-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #ddd; align-items: center; }
        .income-text { color: #28a745; font-weight: bold; }
        .expense-text { color: #dc3545; font-weight: bold; }
        
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        
        /* Прогресс-бар */
        .progress-container { background: #ddd; border-radius: 5px; height: 20px; margin: 10px 0; overflow: hidden; width: 100%; }
        .progress-bar { background: #28a745; height: 100%; width: 0%; transition: width 0.3s; }
        .calc-results { background: #fff; padding: 10px; border-radius: 5px; margin-top: 10px; font-size: 0.9em; border: 1px solid #ccc; }
    </style>
</head>
<body>

    <!-- ЭКРАН ВХОДА -->
    <div id="login-screen" class="container">
        <h2>Вход в аккаунт</h2>
        <p style="text-align: center; color: #666; font-size: 0.9em;">Данные сохраняются в вашем браузере для каждого логина отдельно</p>
        <input type="text" id="username" placeholder="Придумайте логин" autocomplete="off">
        <input type="password" id="password" placeholder="Пароль (любой для демо)">
        <button onclick="login()">Войти / Создать аккаунт</button>
    </div>

    <!-- ОСНОВНОЕ ПРИЛОЖЕНИЕ -->
    <div id="app-screen" class="container hidden">
        <div class="header-top">
            <h2 style="margin: 0;">Ваши финансы</h2>
            <button onclick="logout()" class="btn-danger" style="width: auto; padding: 5px 15px; margin: 0;">Выйти (<span id="current-user-display"></span>)</button>
        </div>

        <div class="dashboard">
            <div>
                <strong>Доходы</strong>
                <div id="total-income" class="income-text">0 ₽</div>
            </div>
            <div>
                <strong>Расходы</strong>
                <div id="total-expense" class="expense-text">0 ₽</div>
            </div>
            <div>
                <strong>Баланс</strong>
                <div id="total-balance">0 ₽</div>
            </div>
        </div>

        <!-- Цель накоплений -->
        <div class="goal-section">
            <h3>План накоплений</h3>
            <div style="display: flex; gap: 10px;">
                <input type="number" id="goal-amount" placeholder="Сумма цели (₽)" oninput="updateGoalUI()">
                <input type="date" id="goal-date" onchange="updateGoalUI()">
            </div>
            
            <div class="progress-container">
                <div id="goal-progress-bar" class="progress-bar"></div>
            </div>
            <p id="goal-text" style="text-align: center; margin: 5px 0;">Прогресс: 0%</p>
            
            <div id="goal-calculations" class="calc-results hidden">
                <strong>Нужно откладывать:</strong><br>
                В день: <span id="calc-day">0</span> ₽<br>
                В неделю: <span id="calc-week">0</span> ₽<br>
                В месяц: <span id="calc-month">0</span> ₽
            </div>
        </div>

        <!-- Добавление транзакции -->
        <h3>Добавить операцию</h3>
        <select id="type">
            <option value="income">Доход</option>
            <option value="expense">Расход</option>
        </select>
        <input type="text" id="description" placeholder="Описание (например, Зарплата или Продукты)">
        <input type="number" id="amount" placeholder="Сумма (₽)">
        <button onclick="addTransaction()">Добавить</button>

        <!-- История -->
        <h3 style="margin-top: 20px;">История операций</h3>
        <ul id="transaction-list" class="transaction-list"></ul>
    </div>

    <script>
        let currentUser = null;
        let userData = {
            transactions: [],
            goalAmount: '',
            goalDate: ''
        };

        window.onload = function() {
            const savedUser = localStorage.getItem('activeSession');
            if (savedUser) {
                document.getElementById('username').value = savedUser;
                login();
            }
        };

        function login() {
            const usernameInput = document.getElementById('username').value.trim();
            if (usernameInput === '') {
                alert('Пожалуйста, введите логин');
                return;
            }
            
            currentUser = usernameInput;
            localStorage.setItem('activeSession', currentUser);
            document.getElementById('current-user-display').innerText = currentUser;
            
            loadData();

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
        }

        function logout() {
            saveData(); // Сохраняем перед выходом на всякий случай
            currentUser = null;
            userData = { transactions: [], goalAmount: '', goalDate: '' };
            localStorage.removeItem('activeSession');
            
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        }

        function addTransaction() {
            const type = document.getElementById('type').value;
            const description = document.getElementById('description').value;
            const amount = parseFloat(document.getElementById('amount').value);

            if (description === '' || isNaN(amount) || amount <= 0) {
                alert('Пожалуйста, введите корректные данные');
                return;
            }

            userData.transactions.push({ id: Date.now(), type, description, amount });
            
            document.getElementById('description').value = '';
            document.getElementById('amount').value = '';
            
            updateUI();
        }

        function deleteTransaction(id) {
            userData.transactions = userData.transactions.filter(t => t.id !== id);
            updateUI();
        }

        function saveData() {
            if (!currentUser) return;
            // Сохраняем текущие значения инпутов цели перед записью
            userData.goalAmount = document.getElementById('goal-amount').value;
            userData.goalDate = document.getElementById('goal-date').value;
            localStorage.setItem('financeData_' + currentUser, JSON.stringify(userData));
        }

        function loadData() {
            const savedData = localStorage.getItem('financeData_' + currentUser);
            if (savedData) {
                userData = JSON.parse(savedData);
                // Восстанавливаем старые данные, если они были сохранены в старом формате (только массив транзакций)
                if (Array.isArray(userData)) {
                    userData = { transactions: userData, goalAmount: '', goalDate: '' };
                }
            } else {
                userData = { transactions: [], goalAmount: '', goalDate: '' };
            }
            
            document.getElementById('goal-amount').value = userData.goalAmount || '';
            document.getElementById('goal-date').value = userData.goalDate || '';
            
            updateUI();
        }

        function updateUI() {
            let income = 0, expense = 0;
            const list = document.getElementById('transaction-list');
            list.innerHTML = '';

            userData.transactions.forEach(t => {
                if (t.type === 'income') income += t.amount;
                if (t.type === 'expense') expense += t.amount;

                const li = document.createElement('li');
                li.className = 'transaction-item';
                li.innerHTML = `
                    <span>${t.description}</span>
                    <span class="${t.type === 'income' ? 'income-text' : 'expense-text'}">
                        ${t.type === 'income' ? '+' : '-'}${t.amount} ₽
                    </span>
                    <button class="btn-danger" style="width: auto; padding: 5px 10px; margin: 0; margin-left: 10px;" onclick="deleteTransaction(${t.id})">X</button>
                `;
                list.appendChild(li);
            });

            document.getElementById('total-income').innerText = income + ' ₽';
            document.getElementById('total-expense').innerText = expense + ' ₽';
            
            const balance = income - expense;
            document.getElementById('total-balance').innerText = balance + ' ₽';
            document.getElementById('total-balance').style.color = balance >= 0 ? '#28a745' : '#dc3545';
            
            updateGoalUI(balance);
            saveData(); // Сохраняем состояние при любом обновлении UI
        }

        function updateGoalUI(currentBalance) {
            // Если баланс не передан в функцию, высчитываем его
            if (currentBalance === undefined) {
                let inc = 0, exp = 0;
                userData.transactions.forEach(t => {
                    if (t.type === 'income') inc += t.amount;
                    if (t.type === 'expense') exp += t.amount;
                });
                currentBalance = inc - exp;
            }

            const goalAmount = parseFloat(document.getElementById('goal-amount').value);
            const goalDateStr = document.getElementById('goal-date').value;
            const calcBox = document.getElementById('goal-calculations');

            // Обновляем прогресс-бар
            if (!isNaN(goalAmount) && goalAmount > 0) {
                let percent = (currentBalance / goalAmount) * 100;
                if (percent < 0) percent = 0;
                if (percent > 100) percent = 100;
                
                document.getElementById('goal-progress-bar').style.width = percent + '%';
                document.getElementById('goal-text').innerText = `Прогресс: ${percent.toFixed(1)}% (${currentBalance} из ${goalAmount} ₽)`;
            } else {
                document.getElementById('goal-progress-bar').style.width = '0%';
                document.getElementById('goal-text').innerText = 'Прогресс: 0%';
            }

            // Расчеты по дате
            if (!isNaN(goalAmount) && goalAmount > 0 && goalDateStr) {
                const goalDate = new Date(goalDateStr);
                const today = new Date();
                today.setHours(0,0,0,0);
                
                const timeDiff = goalDate.getTime() - today.getTime();
                const daysLeft = Math.ceil(timeDiff / (1000 * 3600 * 24));
                const amountLeft = goalAmount - currentBalance;

                if (daysLeft > 0 && amountLeft > 0) {
                    calcBox.classList.remove('hidden');
                    
                    const perDay = amountLeft / daysLeft;
                    const perWeek = perDay * 7;
                    const perMonth = perDay * 30.44; // Среднее кол-во дней в месяце

                    document.getElementById('calc-day').innerText = perDay.toFixed(0);
                    document.getElementById('calc-week').innerText = perWeek.toFixed(0);
                    document.getElementById('calc-month').innerText = perMonth.toFixed(0);
                } else if (amountLeft <= 0) {
                    calcBox.classList.remove('hidden');
                    calcBox.innerHTML = '<strong style="color: #28a745;">Цель достигнута! 🎉</strong>';
                } else {
                    calcBox.classList.add('hidden');
                }
            } else {
                calcBox.classList.add('hidden');
            }
            
            saveData();
        }
    </script>
</body>
</html>
