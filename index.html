<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Финансовый трекер</title>
    <!-- Подключаем современный шрифт Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --border: #e5e7eb;
            --input-bg: #f9fafb;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            margin: 0; 
            padding: 20px; 
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container { 
            width: 100%;
            max-width: 600px; 
            background: var(--card-bg); 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01); 
            transition: all 0.3s ease;
        }

        h2 { margin-top: 0; font-weight: 700; color: #111827; }
        h3 { margin: 25px 0 15px; font-weight: 600; font-size: 1.1rem; color: #374151; }
        p { color: var(--text-muted); line-height: 1.5; }
        
        /* Формы и инпуты */
        input, select { 
            width: 100%; 
            padding: 14px 16px; 
            margin-bottom: 12px; 
            border-radius: 10px; 
            border: 1px solid var(--border); 
            background-color: var(--input-bg);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            color: var(--text-main);
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        /* Кнопки */
        button { 
            width: 100%; 
            padding: 14px; 
            background-color: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer; 
            transition: all 0.2s ease;
        }
        button:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
        button:active { transform: translateY(0); }
        
        .btn-danger { background-color: transparent; color: var(--danger); border: 1px solid var(--danger); }
        .btn-danger:hover { background-color: var(--danger); color: white; }

        /* Утилиты */
        .hidden { display: none !important; }
        
        /* Шапка */
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
        .header-top h2 { margin: 0; font-size: 1.4rem; }
        .header-top button { width: auto; padding: 8px 16px; font-size: 0.85rem; border-radius: 8px; }

        /* Дашборд (Карточки) */
        .dashboard { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 15px; 
            margin-bottom: 25px; 
        }
        .stat-card { 
            background: var(--input-bg); 
            padding: 15px; 
            border-radius: 12px; 
            text-align: center; 
            border: 1px solid var(--border);
        }
        .stat-card span { display: block; font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; font-weight: 600; }
        .stat-card div { font-size: 1.2rem; font-weight: 700; }
        .text-green { color: var(--success) !important; }
        .text-red { color: var(--danger) !important; }

        /* Секция цели */
        .goal-section { 
            background: #f8fafc; 
            padding: 20px; 
            border-radius: 12px; 
            border: 1px solid #e2e8f0;
            margin-bottom: 25px; 
        }
        .goal-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        /* Прогресс-бар */
        .progress-container { background: #e2e8f0; border-radius: 10px; height: 12px; margin: 15px 0; overflow: hidden; width: 100%; box-shadow: inset 0 1px 2px rgba(0,0,0,0.05); }
        .progress-bar { background: linear-gradient(90deg, #3b82f6, #10b981); height: 100%; width: 0%; transition: width 0.5s ease-out; border-radius: 10px; }
        .progress-text { text-align: center; font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }
        
        /* Результаты расчетов */
        .calc-results { background: white; padding: 15px; border-radius: 10px; margin-top: 15px; font-size: 0.9rem; border: 1px dashed #cbd5e1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; }
        .calc-results strong { grid-column: span 3; margin-bottom: 5px; color: var(--text-main); }
        .calc-item span { display: block; font-weight: 700; font-size: 1.1rem; color: var(--primary); }

        /* Список транзакций */
        .transaction-list { list-style: none; padding: 0; margin: 0; }
        .transaction-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 12px 15px; margin-bottom: 8px; 
            background: var(--input-bg); border-radius: 10px; 
            border: 1px solid var(--border); transition: transform 0.2s;
        }
        .transaction-item:hover { transform: scale(1.01); background: white; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); border-color: #d1d5db; }
        .transaction-info { font-weight: 500; display: flex; align-items: center; gap: 10px; }
        .transaction-actions { display: flex; align-items: center; gap: 15px; }
        .transaction-amount { font-weight: 700; font-size: 0.95rem; }
        .btn-delete { 
            background: #fee2e2; color: var(--danger); width: 28px; height: 28px; 
            padding: 0; border-radius: 6px; display: flex; align-items: center; justify-content: center; 
            font-size: 0.8rem; border: none;
        }
        .btn-delete:hover { background: var(--danger); color: white; }

        /* Адаптивность для телефонов */
        @media (max-width: 500px) {
            .dashboard { grid-template-columns: 1fr; gap: 10px; }
            .goal-inputs { grid-template-columns: 1fr; }
            .calc-results { grid-template-columns: 1fr; text-align: left; }
            .calc-results strong { grid-column: span 1; }
            .calc-item { display: flex; justify-content: space-between; border-bottom: 1px solid #f1f5f9; padding-bottom: 5px; }
            .calc-item:last-child { border-bottom: none; }
        }
    </style>
</head>
<body>

    <!-- ЭКРАН ВХОДА -->
    <div id="login-screen" class="container">
        <div style="text-align: center; margin-bottom: 30px;">
            <div style="font-size: 3rem; margin-bottom: 10px;">👋</div>
            <h2>Добро пожаловать</h2>
            <p style="font-size: 0.9rem; margin-top: 5px;">Ваши данные безопасно хранятся в браузере</p>
        </div>
        <input type="text" id="username" placeholder="Придумайте логин" autocomplete="off">
        <input type="password" id="password" placeholder="Пароль (любой для демо)">
        <button onclick="login()">Войти в приложение</button>
    </div>

    <!-- ОСНОВНОЕ ПРИЛОЖЕНИЕ -->
    <div id="app-screen" class="container hidden">
        <div class="header-top">
            <h2>💰 Ваши финансы</h2>
            <button onclick="logout()" class="btn-danger">Выйти (<span id="current-user-display"></span>)</button>
        </div>

        <div class="dashboard">
            <div class="stat-card">
                <span>Доходы</span>
                <div id="total-income" class="text-green">0 ₽</div>
            </div>
            <div class="stat-card">
                <span>Расходы</span>
                <div id="total-expense" class="text-red">0 ₽</div>
            </div>
            <div class="stat-card" style="background: var(--text-main); color: white; border-color: var(--text-main);">
                <span style="color: #9ca3af;">Баланс</span>
                <div id="total-balance">0 ₽</div>
            </div>
        </div>

        <!-- Цель накоплений -->
        <div class="goal-section">
            <h3 style="margin-top: 0;">🎯 План накоплений</h3>
            <div class="goal-inputs">
                <input type="number" id="goal-amount" placeholder="Сумма цели (₽)" oninput="updateGoalUI()">
                <input type="date" id="goal-date" onchange="updateGoalUI()">
            </div>
            
            <div class="progress-container">
                <div id="goal-progress-bar" class="progress-bar"></div>
            </div>
            <div id="goal-text" class="progress-text">Прогресс: 0%</div>
            
            <div id="goal-calculations" class="calc-results hidden">
                <strong>Нужно откладывать:</strong>
                <div class="calc-item">В день: <span id="calc-day">0 ₽</span></div>
                <div class="calc-item">В неделю: <span id="calc-week">0 ₽</span></div>
                <div class="calc-item">В месяц: <span id="calc-month">0 ₽</span></div>
            </div>
        </div>

        <!-- Добавление транзакции -->
        <h3>➕ Добавить операцию</h3>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <select id="type" style="flex: 1; min-width: 120px;">
                <option value="income">🟢 Доход</option>
                <option value="expense">🔴 Расход</option>
            </select>
            <input type="number" id="amount" placeholder="Сумма (₽)" style="flex: 2; min-width: 150px;">
        </div>
        <input type="text" id="description" placeholder="Описание (например, Зарплата или Продукты)">
        <button onclick="addTransaction()" style="background-color: #111827;">Добавить запись</button>

        <!-- История -->
        <h3 style="margin-top: 30px;">📋 История операций</h3>
        <ul id="transaction-list" class="transaction-list"></ul>
    </div>

    <script>
        let currentUser = null;
        let userData = {
            transactions: [],
            goalAmount: '',
            goalDate: ''
        };

        window.onload = function() {
            const savedUser = localStorage.getItem('activeSession');
            if (savedUser) {
                document.getElementById('username').value = savedUser;
                login();
            }
        };

        function login() {
            const usernameInput = document.getElementById('username').value.trim();
            if (usernameInput === '') {
                alert('Пожалуйста, введите логин');
                return;
            }
            
            currentUser = usernameInput;
            localStorage.setItem('activeSession', currentUser);
            document.getElementById('current-user-display').innerText = currentUser;
            
            loadData();

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
        }

        function logout() {
            saveData(); 
            currentUser = null;
            userData = { transactions: [], goalAmount: '', goalDate: '' };
            localStorage.removeItem('activeSession');
            
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        }

        function addTransaction() {
            const type = document.getElementById('type').value;
            const description = document.getElementById('description').value;
            const amount = parseFloat(document.getElementById('amount').value);

            if (description === '' || isNaN(amount) || amount <= 0) {
                alert('Пожалуйста, введите корректное описание и сумму');
                return;
            }

            userData.transactions.unshift({ id: Date.now(), type, description, amount }); // unshift добавляет в начало списка
            
            document.getElementById('description').value = '';
            document.getElementById('amount').value = '';
            
            updateUI();
        }

        function deleteTransaction(id) {
            userData.transactions = userData.transactions.filter(t => t.id !== id);
            updateUI();
        }

        function saveData() {
            if (!currentUser) return;
            userData.goalAmount = document.getElementById('goal-amount').value;
            userData.goalDate = document.getElementById('goal-date').value;
            localStorage.setItem('financeData_' + currentUser, JSON.stringify(userData));
        }

        function loadData() {
            const savedData = localStorage.getItem('financeData_' + currentUser);
            if (savedData) {
                userData = JSON.parse(savedData);
                if (Array.isArray(userData)) {
                    userData = { transactions: userData, goalAmount: '', goalDate: '' };
                }
            } else {
                userData = { transactions: [], goalAmount: '', goalDate: '' };
            }
            
            document.getElementById('goal-amount').value = userData.goalAmount || '';
            document.getElementById('goal-date').value = userData.goalDate || '';
            
            updateUI();
        }

        function formatMoney(amount) {
            return new Intl.NumberFormat('ru-RU').format(amount);
        }

        function updateUI() {
            let income = 0, expense = 0;
            const list = document.getElementById('transaction-list');
            list.innerHTML = '';

            if (userData.transactions.length === 0) {
                list.innerHTML = '<li style="text-align:center; color:#9ca3af; padding: 20px;">Операций пока нет. Добавьте первую!</li>';
            }

            userData.transactions.forEach(t => {
                if (t.type === 'income') income += t.amount;
                if (t.type === 'expense') expense += t.amount;

                const li = document.createElement('li');
                li.className = 'transaction-item';
                li.innerHTML = `
                    <div class="transaction-info">
                        <span style="font-size: 1.2rem;">${t.type === 'income' ? '🟢' : '🔴'}</span>
                        <span>${t.description}</span>
                    </div>
                    <div class="transaction-actions">
                        <span class="transaction-amount ${t.type === 'income' ? 'text-green' : 'text-red'}">
                            ${t.type === 'income' ? '+' : '-'}${formatMoney(t.amount)} ₽
                        </span>
                        <button class="btn-delete" onclick="deleteTransaction(${t.id})">✕</button>
                    </div>
                `;
                list.appendChild(li);
            });

            document.getElementById('total-income').innerText = formatMoney(income) + ' ₽';
            document.getElementById('total-expense').innerText = formatMoney(expense) + ' ₽';
            
            const balance = income - expense;
            document.getElementById('total-balance').innerText = formatMoney(balance) + ' ₽';
            document.getElementById('total-balance').style.color = balance < 0 ? '#ef4444' : 'white';
            
            updateGoalUI(balance);
            saveData();
        }

        function updateGoalUI(currentBalance) {
            if (currentBalance === undefined) {
                let inc = 0, exp = 0;
                userData.transactions.forEach(t => {
                    if (t.type === 'income') inc += t.amount;
                    if (t.type === 'expense') exp += t.amount;
                });
                currentBalance = inc - exp;
            }

            const goalAmount = parseFloat(document.getElementById('goal-amount').value);
            const goalDateStr = document.getElementById('goal-date').value;
            const calcBox = document.getElementById('goal-calculations');

            if (!isNaN(goalAmount) && goalAmount > 0) {
                let percent = (currentBalance / goalAmount) * 100;
                if (percent < 0) percent = 0;
                if (percent > 100) percent = 100;
                
                document.getElementById('goal-progress-bar').style.width = percent + '%';
                document.getElementById('goal-text').innerText = `Прогресс: ${percent.toFixed(1)}% (${formatMoney(currentBalance)} из ${formatMoney(goalAmount)} ₽)`;
            } else {
                document.getElementById('goal-progress-bar').style.width = '0%';
                document.getElementById('goal-text').innerText = 'Задайте сумму цели, чтобы увидеть прогресс';
            }

            if (!isNaN(goalAmount) && goalAmount > 0 && goalDateStr) {
                const goalDate = new Date(goalDateStr);
                const today = new Date();
                today.setHours(0,0,0,0);
                
                const timeDiff = goalDate.getTime() - today.getTime();
                const daysLeft = Math.ceil(timeDiff / (1000 * 3600 * 24));
                const amountLeft = goalAmount - currentBalance;

                if (daysLeft > 0 && amountLeft > 0) {
                    calcBox.classList.remove('hidden');
                    
                    const perDay = amountLeft / daysLeft;
                    const perWeek = perDay * 7;
                    const perMonth = perDay * 30.44;

                    document.getElementById('calc-day').innerText = formatMoney(Math.ceil(perDay)) + ' ₽';
                    document.getElementById('calc-week').innerText = formatMoney(Math.ceil(perWeek)) + ' ₽';
                    document.getElementById('calc-month').innerText = formatMoney(Math.ceil(perMonth)) + ' ₽';
                } else if (amountLeft <= 0) {
                    calcBox.classList.remove('hidden');
                    calcBox.innerHTML = '<strong style="color: var(--success); font-size: 1.1rem;">🎉 Цель достигнута! Вы накопили нужную сумму.</strong>';
                } else {
                    calcBox.classList.add('hidden');
                }
            } else {
                calcBox.classList.add('hidden');
            }
            
            saveData();
        }
    </script>
</body>
</html>
